<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="100%">
  <!-- 5 Puntos Verticales Oficiales PIM-D con sombreado suave -->
  <circle cx="26" cy="38" r="14" fill="#E85D04" />
  <circle cx="26" cy="71" r="14" fill="#F48C06" />
  <circle cx="26" cy="104" r="14" fill="#2A9D8F" />
  <circle cx="26" cy="137" r="14" fill="#E63946" />
  <circle cx="26" cy="170" r="14" fill="#0096C7" />

  <!-- Texto Principal: PIM-D -->
  <!-- Letras P I M en Azul Marino Institucional Profundo -->
  <text x="65" y="160" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-weight="900" font-size="155" fill="#152B52" letter-spacing="-3">PIM</text>
  
  <!-- Guión Conector -->
  <rect x="368" y="98" width="30" height="24" rx="4" fill="#152B52" />

  <!-- Letra D en Rojo Institucional Intenso -->
